services:
  # Service 1: Auth Service (Bài 2) & Product Service (Cổng 8001)
  auth-product-service:
    build: .
    container_name: auth-product-service
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8001"
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - AUTH_SERVICE_URL=http://auth-product-service:8001/api/auth/
      - PRODUCT_SERVICE_URL=http://auth-product-service:8001/api/products
    restart: unless-stopped
    networks:
      - soa-network

  # Service 2: Order Management Service (Cổng 8002)
  order-service:
    build: .
    container_name: order-service
    command: python manage.py runserver 0.0.0.0:8002
    ports:
      - "8002:8002"
    volumes:
      - .:/app
    depends_on:
      - auth-product-service
    environment:
      - PYTHONUNBUFFERED=1
      - AUTH_SERVICE_URL=http://auth-product-service:8001/api/auth/
      - PRODUCT_SERVICE_URL=http://auth-product-service:8001/api/products
    restart: unless-stopped
    networks:
      - soa-network

  # Service 3: Report Management Service (Cổng 8003)
  report-service:
    build: .
    container_name: report-service
    command: python manage.py runserver 0.0.0.0:8003
    ports:
      - "8003:8003"
    volumes:
      - .:/app
    depends_on:
      - auth-product-service
      - order-service
    environment:
      - PYTHONUNBUFFERED=1
      - AUTH_SERVICE_URL=http://auth-product-service:8001/api/auth/
      - PRODUCT_SERVICE_URL=http://auth-product-service:8001/api/products
      - ORDER_SERVICE_URL=http://order-service:8002/orders
    restart: unless-stopped
    networks:
      - soa-network

networks:
  soa-network:
    driver: bridge

